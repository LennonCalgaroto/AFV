<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Logo AFV Recursos Humanos">
  <!-- Versão vetorizada aproximada baseada na imagem enviada -->
  <defs>
    <style>
      .bg{fill:#f7f2ec}
      .stroke{fill:none;stroke:#083B32;stroke-width:24;}
      .box{fill:none;stroke:#083B32;stroke-width:18}
      .afv{fill:#083B32;font-family:Arial, Helvetica, sans-serif;font-weight:700;font-size:220px}
      .title{fill:#083B32;font-family:Arial, Helvetica, sans-serif;font-weight:700;font-size:120px}
      .subtitle{fill:#083B32;font-family:Arial, Helvetica, sans-serif;font-weight:700;font-size:56px;letter-spacing:2px}
    </style>
  </defs>

  <!-- fundo e borda externa -->
  <rect class="bg" x="0" y="0" width="1200" height="700" />
  <rect class="stroke" x="20" y="20" width="1160" height="660" rx="0" />

  <!-- quadrado com AFV à esquerda -->
  <rect class="box" x="80" y="140" width="420" height="420" rx="6" />
  <text class="afv" x="290" y="390" text-anchor="middle" dominant-baseline="middle">AFV</text>

  <!-- textos à direita -->
  <text class="title" x="560" y="220">RECURSOS</text>
  <text class="title" x="560" y="360">HUMANOS</text>

  <text class="subtitle" x="560" y="460">DP E RH</text>
  <text class="subtitle" x="560" y="520">CONSULTORIA</text>
  <text class="subtitle" x="560" y="580">DE TECNOLOGIA</text>
</svg>
